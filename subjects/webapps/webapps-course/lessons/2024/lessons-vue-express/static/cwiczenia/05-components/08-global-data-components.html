<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
              goldenPrimary: "#F6D108",
              goldenSecondary: "#EDC211",
              goldenDark: "#DAA521",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-primary;
        }
      }

      @layer utilities {
        button {
          @apply py-2 px-5 bg-gradient-to-br from-secondary to-accent saturate-100 hover:saturate-0 rounded-lg tracking-widest text-white	transition-all ease-linear duration-200;
        }
        button:disabled {
          @apply bg-none bg-gray-200;
        }
        .card {
          @apply rounded-lg py-4 pr-8 px-4  w-fit;
          box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        }
        input[type="text"] {
          @apply p-2 border-2 border-primary rounded-lg;
        }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-2 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/vue.svg" alt="V" />
        </a>
        <h1 v-text="title"></h1>
      </div>
      <div class="flex gap-4">
        <items-component :element-list="elementList"></items-component>
        <change-title-component
          :global-title="title"
          :update-title="(newTitle) => {this.title=newTitle}"
        ></change-title-component>
        <add-item-component :add-card="(c) => this.addCard(c)"></add-item-component>
      </div>
    </div>
  </body>
  <script>
    const ItemComponent = {
      template: `
      <div class="card">
        <h2 class="text-xl">{{title}}</h2>
        <ul>
          <li v-for="element in elementList" :key="element.name" class="my-3 px-4">
            <label class="p-1">
              <!-- ITS SO FUNNY THAT THIS IS WORKING -->
              {{element.name}} <input type="checkbox" class="accent-primary mr-2" v-model="element.checked" />
            </label>
          </li>
        </ul>
      </div>`,
      props: ["elementList"],
      data() {
        return {
          title: "Items component",
        };
      },
      methods: {},
      computed: {},
    };
    const ChangeTitleComponent = {
      template: `<div class="card">
        <h2 class="text-xl mb-4">{{title}}</h2>
        <input type="text" @input="(e) => updateTitle(e.target.value)" :value="globalTitle" />
        </div>`,
      props: ["globalTitle", "updateTitle"],
      data() {
        return {
          title: "Change title component",
        };
      },
      methods: {},
      computed: {},
    };
    const AddItemComponent = {
      template: `<div class="card">
        <h2 class="text-xl mb-4">{{title}}</h2>
        <div class="flex gap-4">
          <input type="text" v-model="inputValue" class="p-2 m-0" />
          <button @click="handleAddingCard">Add item</button>
        </div>
        </div>`,
      props: ["addCard"],
      data() {
        return {
          title: "Add item component",
          inputValue: "",
        };
      },
      methods: {
        handleAddingCard() {
          console.log(this.$props);
          this.$props.addCard(this.inputValue);
          this.inputValue = "";
        },
      },
      computed: {},
    };
    const app = Vue.createApp({
      data() {
        return {
          title: "Lesson 8 - components",
          elementList: [
            { name: "Element 1", checked: true },
            { name: "Element 2", checked: false },
            { name: "Element 3", checked: true },
          ],
        };
      },
      methods: {
        addCard(newCard) {
          this.elementList.push({ name: newCard, checked: false });
        },
      },
      computed: {},
      components: {
        "items-component": ItemComponent,
        "change-title-component": ChangeTitleComponent,
        "add-item-component": AddItemComponent,
      },
    }).mount("#app");
  </script>
</html>
