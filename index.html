    <title>Vite + TS</title>

          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 9.25H13.75V5"/>
        </svg>        
      </button>  
      <div class="fridge-count__wrapper">
        <p>Przebieg: </p>
        <p>Na lodówce: </p>
      </div>
    </div>
