<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
        <div class="window active glass ">
            <div class="title-bar">
                <div class="title-bar-text">Gra żużel - Stanisław Dębicki</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body has-space">
                <canvas width="1200" height="600"></canvas>
            </div>
        </div>
        <div class="window active form-window">
            <div class="title-bar">
                <div class="title-bar-text">Gra żużel - Stanisław Dębicki</div>
                <div class="title-bar-controls">
                    <button aria-label="Minimize"></button>
                    <button aria-label="Maximize"></button>
                    <button aria-label="Close"></button>
                </div>
            </div>
            <div class="window-body has-space">
                <form id="player-form">
                    <section class="tabs">
                        <menu role="tablist" aria-label="Sample Tabs">
                          <button role="tab" aria-controls="tab-A" aria-selected="true">Players</button>
                          <button role="tab" aria-controls="tab-B">Game</button>
                        </menu>
                        <article role="tabpanel" id="tab-A">
                            <div class="taba__wrapper">
                                <fieldset class="player player-card">
                                    <h2>Player 1</h2>
                                    <h5>Player</h5>
                                    <div class="field-row">
                                        <label for="player-1-nickname">Nickname</label>
                                        <input id="player-1-nickname" type="text">
                                    </div>
                                    <h5>Controls</h5>
                                    <div class="field-row">
                                        <label for="player-1-l" style="width: max-content;">Key left</label>
                                        <input id="player-1-l" type="text">
                                    </div>
                                    <div class="field-row">
                                        <label for="player-1-r">Key right</label>
                                        <input id="player-1-r" type="text">
                                    </div>
                                </fieldset>
                                <fieldset class="player"></fieldset>
                                <fieldset class="player"></fieldset>
                                <fieldset class="player"></fieldset>
                            </div>
                            <div class="button__wrapper">
                                <button class="add-player__button" type="button">Add player</button>
                                <button class="remove-player__button" type="button">Remove last</button>
                                <button class="start__button">Start!</button>
                            </div>
                        </article>
                        <article role="tabpanel" id="tab-B" hidden>
                            <p>About game</p>
                        </article>
                    </section>
                </form>
            </div>
        </div>
</body>
</html>
