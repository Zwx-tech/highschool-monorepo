<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
              goldenPrimary: "#F6D108",
              goldenSecondary: "#EDC211",
              goldenDark: "#DAA521",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-primary;
        }
      }

      @layer utilities {
        button {
          @apply py-2 px-5 bg-gradient-to-br from-secondary to-accent saturate-100 hover:saturate-0 rounded-lg tracking-widest text-white  transition-all ease-linear duration-200;
        }
        button:disabled {
          @apply bg-none bg-gray-200;
        }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-2 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/vue.svg" alt="V" />
        </a>
        <h1 v-text="title"></h1>
      </div>
      <div class="flex gap-4">
        <form class="w-fit bg-gray-50 rounded-lg p-6 flex gap-4 items-start flex-col" action="/fiction">
          <div class="flex gap-2 items-center">
            <input
              type="text"
              id="large-input"
              class="block w-fit mr-4 p-2 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              v-model="fFirstName"
            />
            <p class="text-xl">Len: {{ fFirstName.length }}</p>
          </div>
          <div class="flex gap-2 items-center">
            <input
              type="text"
              id="large-input"
              class="block w-fit mr-4 p-2 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              v-model="fSecondName"
            />
            <p class="text-xl">Len: {{ fSecondName.length }}</p>
          </div>
          <div class="flex gap-2 items-center">
            <input
              type="text"
              id="large-input"
              class="block w-fit mr-4 p-2 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              v-model="fProfession"
            />
            <p class="text-xl">Len: {{ fProfession.length }}</p>
          </div>
          <div class="flex gap-2 items-center">
            <input
              type="text"
              id="large-input"
              class="block w-fit mr-4 p-2 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              v-model="fSalary"
            />
            <p class="text-xl">Len: {{ `${fSalary}`.length }}</p>
          </div>
          <button :disabled="!isReady" class="w-full" type="submit">Send</button>
        </form>
        <div class="bg-gray-50 w-[24rem] rounded-lg p-4">
          <p class="text-xl">
            <span class="font-medium">First & second name: </span> {{ `${fFirstName} ${fSecondName}` }}
          </p>
          <p class="text-xl mt-2"><span class="font-medium">Profession: </span> {{ fProfession }}</p>
          <p class="text-xl mt-2"><span class="font-medium">Salary: </span> {{ fSalary }}</p>
        </div>
      </div>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          title: "Form - v-model",
          fFirstName: "",
          fSecondName: "",
          fProfession: "",
          fSalary: "",
        };
      },
      methods: {},
      computed: {
        isReady() {
          return !!this.fFirstName && !!this.fSecondName && !!this.fProfession && !!this.fSalary;
        },
      },
    }).mount("#app");
  </script>
</html>
