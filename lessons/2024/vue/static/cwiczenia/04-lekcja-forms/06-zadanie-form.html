<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
              goldenPrimary: "#F6D108",
              goldenSecondary: "#EDC211",
              goldenDark: "#DAA521",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-goldenDark;
        }
      }

      @layer utilities {
        button {
          @apply py-2 px-5 bg-gradient-to-br from-goldenPrimary to-goldenSecondary saturate-100 hover:saturate-0 rounded-lg tracking-widest text-white	transition-all ease-linear duration-200;
        }
        button:disabled {
          @apply bg-none bg-gray-200;
        }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-2 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/golden-vue.svg" alt="V" />
        </a>
        <h1 v-text="title"></h1>
      </div>
      <form v-if="!loading" class="flex gap-4 items-start" @submit.prevent>
        <div class="flex flex-col w-1/3 gap-4">
          <div class="border-[.15rem] p-4 grid grid-cols-3 rounded-lg">
            <h2 class="text-xl col-span-3 ml-6 mb-2">Select products</h2>
            <div v-for="product in data.products" class="p-2">
              <label class="ml-4 text-lg">
                <input type="checkbox" class="accent-primary p-1" v-model="product.selected" /> {{
                product.name }}
              </label>
            </div>
          </div>
          <div class="border-[.15rem] p-4 grid grid-cols-1 rounded-lg">
            <h2 class="text-xl ml-6 mb-2">Select delivery option</h2>
            <div v-for="option in data.deliveryOptions" class="p-2">
              <label class="ml-4 text-lg flex items-center gap-2">
                <img :src="`/img${option.image}`" :alt="option.name" class="w-16" />
                <input
                  type="radio"
                  class="accent-primary p-1"
                  v-model="deliveryOption"
                  :value="option.name"
                />
                {{ option.name }}
              </label>
            </div>
          </div>
          <div class="border-[.15rem] p-4 grid grid-cols-1 rounded-lg">
            <h2 class="text-xl ml-6 mb-2">Select payment option</h2>
            <div v-for="option in data.paymentOptions" class="p-2">
              <label class="ml-4 text-lg flex items-center gap-2">
                <img :src="`/img${option.image}`" :alt="option.name" class="w-16" />
                <input type="radio" class="accent-primary p-1" v-model="paymentOption" :value="option.name" />
                {{ option.name }}
              </label>
            </div>
          </div>
        </div>
        <div class="w-1/3 p-6 rounded-lg bg-gray-100 flex flex-col">
          <h2 class="text-2xl mb-4 font-medium">Order summary</h2>
          <hr />
          <h3 class="text-xl mt-2 mb-2 font-medium">Products</h3>
          <ul v-if="selectedProducts.length != 0" class="mb-2">
            <li v-for="product in selectedProducts" class="ml-2">{{product.name}}</li>
          </ul>
          <p v-if="selectedProducts.length == 0" class="mb-2">No products to show</p>
          <hr class="my-1" />
          <p class="text-lg mt-2 mb-2">
            <span class="font-medium">Delivery option </span> {{ deliveryOption }}
          </p>
          <hr class="my-1" />
          <p class="text-lg mt-2 mb-2"><span class="font-medium">Payment option </span> {{ paymentOption}}</p>
          <hr class="my-1" />
          <label class="text-lg mb-4 mt-2">
            <input type="checkbox" class="accent-goldenPrimary mr-2" v-model="dataIntegrity" /> I confirm the
            compliance of the data provided in the form
          </label>
          <button :disabled="!formValid">Send</button>
        </div>
      </form>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          title: "Dynamic data form",
          data: null,
          loading: true,
          deliveryOption: null,
          paymentOption: null,
          dataIntegrity: false,
        };
      },
      created() {
        this.fetchData();
      },
      methods: {
        async fetchData() {
          const response = await fetch("/exerciseData/cartMockup");
          this.data = await response.json();
          this.loading = false;
        },
      },
      computed: {
        selectedProducts() {
          return this.data.products.filter((product) => product.selected);
        },
        formValid() {
          return (
            this.selectedProducts.length > 0 &&
            this.deliveryOption &&
            this.paymentOption &&
            this.dataIntegrity
          );
        },
      },
    }).mount("#app");
  </script>
</html>
