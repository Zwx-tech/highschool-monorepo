<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-primary;
        }
      }

      @layer utilities {
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-4 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/vue.svg" alt="V" />
        </a>
        <h1>{{ title }}</h1>
      </div>
      <a :href="getLink()">
        <img v-bind:src="getImage()" class="aspect-square w-16" />
      </a>
    </div>
  </body>
  <script>
    Vue.createApp({
      data() {
        return {
          title: "Funkcje i atrybuty",
          link: "https://vuejs.org/",
          image: "/img/vue.svg",
        };
      },
      methods: {
        getLink() {
          return this.link;
        },
        getImage() {
          return this.image;
        },
      },
    }).mount("#app");
  </script>
</html>
