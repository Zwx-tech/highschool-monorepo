<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-primary;
        }
      }

      @layer utilities {
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-4 pb-4">
        <img class="aspect-square h-12 pb-1" src="/img/vue.svg" alt="V" />
        <h1>{{ title }}</h1>
      </div>
      <div class="flex w-[50vw] min-w-[60rem]">
        <div class="flex-1">
          <h2>"Ręczne" pobieranie</h2>
          <h4 class="mt-2 mb-2">array</h4>
          <ul class="list-disc ml-8">
            <li>{{ array[0]}}</li>
            <li>{{ array[1]}}</li>
            <li>{{ array[2]}}</li>
          </ul>
        </div>
        <div class="flex-1">
          <h2>Dynamiczne pobieranie</h2>
          <h4 class="mt-2 mb-2">array</h4>
          <ul class="list-disc ml-8">
            <li v-for="item in array">{{item}}</li>
          </ul>
          <h4 class="mt-4 mb-2">array2</h4>
          <ul class="list-disc ml-8">
            <li v-for="item in array2">{{item}}</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
  <script>
    Vue.createApp({
      data() {
        return {
          title: "Dyrektywy VueJS",
          array: [1, 2, 3, 4, 5],
          array2: ["d", "b", "c", "a"],
        };
      },
    }).mount("#app");
  </script>
</html>
