<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-primary;
        }
      }

      @layer utilities {
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-2 pb-4">
        <img class="aspect-square h-12 pb-1" src="/img/vue.svg" alt="V" />
        <h1 class="" v-text="title"></h1>
      </div>
      <p v-text="description"></p>
    </div>
  </body>
  <script>
    Vue.createApp({
      data() {
        return {
          title: "Dyrektywy VueJS",
          description: `dyrektywa v-text zamiast brak interpretacji <b>HTML</b> ale jest
aktualizacja po zmianie wartości`,
        };
      },
    }).mount("#app");
  </script>
</html>
