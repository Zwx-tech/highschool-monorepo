<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
              goldenPrimary: "#F6D108",
              goldenSecondary: "#EDC211",
              goldenDark: "#DAA521",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-primary;
        }
      }

      @layer utilities {
        button {
          @apply py-2 px-5 bg-gradient-to-br from-secondary to-accent saturate-100 hover:saturate-0 rounded-lg tracking-widest text-white  transition-all ease-linear duration-200;
        }
        button.btn-special {
          @apply bg-gradient-to-br from-goldenPrimary to-goldenSecondary;
        }
        .btn-container {
          @apply py-1 flex gap-3 flex-wrap;
        }
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-2 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/vue.svg" alt="V" />
        </a>
        <h1 v-text="title"></h1>
      </div>
      <div class="flex">
        <div class="flex-1">
          <h4 class="text-2xl mb-2">Cw 01</h4>
          <button @click="btnAlert()">Click me</button>
          <h4 class="text-2xl mb-2 mt-6">Cw 02</h4>
          <select
            id="countries"
            @change="handleSelectChange"
            class="max-w-[10rem] bg-gray-50 border border-primary text-primary text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          >
            <option>Choose a country</option>
            <option>United States</option>
            <option>Canada</option>
            <option>France</option>
            <option>Germany</option>
          </select>
          <p class="mt-2">{{ selected }}</p>
          <h4 class="text-2xl mb-2 mt-6">Cw 03</h4>
          <div class="relative mb-6 max-w-[30rem]">
            <label for="labels-range-input" class="sr-only">Labels range</label>
            <input
              id="labels-range-input"
              type="range"
              value="50"
              min="0"
              max="100"
              @input="onRangeInput"
              class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-700"
            />
            <span class="text-sm text-gray-500 dark:text-gray-400 absolute start-0 -bottom-6">Min 0</span>
            <span
              class="text-sm text-gray-500 dark:text-gray-400 absolute start-1/3 -translate-x-1/2 rtl:translate-x-1/2 -bottom-6"
              >25</span
            >
            <span
              class="text-sm text-gray-500 dark:text-gray-400 absolute start-2/3 -translate-x-1/2 rtl:translate-x-1/2 -bottom-6"
              >75</span
            >
            <span class="text-sm text-gray-500 dark:text-gray-400 absolute end-0 -bottom-6">Max 100</span>
          </div>
          <p class="mt-2">{{ rangeValue }}</p>
        </div>
        <div class="flex-1">
          <h4 class="text-2xl mb-2">Cw 04</h4>
          <div
            class="flex items-center ps-4 border border-gray-200 rounded dark:border-gray-700 max-w-[10rem]"
          >
            <input
              id="bordered-checkbox-1"
              type="checkbox"
              value=""
              @change="onCheckboxChange"
              name="bordered-checkbox"
              class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600"
            />
            <label
              for="bordered-checkbox-1"
              class="w-full py-4 ms-2 text-sm font-medium text-gray-900 dark:text-gray-300"
              >{{ checkboxVal }}</label
            >
          </div>
          <h4 class="text-2xl mb-2 mt-6">Cw 05</h4>
          <div class="flex gap-4 items-center">
            <button @click="() => this.counter++">Increment counter</button>
            <p class="text-xl">{{counter }}</p>
          </div>
          <h4 class="text-2xl mb-2 mt-6">Cw 05</h4>
          <div class="flex gap-4 items-center">
            <button @click="() => this.counter2=Math.pow(2, this.counter)">Increment counter</button>
            <p class="text-xl">{{ counter2 }}</p>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          title: "Events - simple",
          selected: "Choose a country",
          rangeValue: 50,
          checkboxVal: false,
          counter: 0,
          counter2: 0,
        };
      },
      methods: {
        btnAlert() {
          alert("U clicked me!!!");
        },
        handleSelectChange(e) {
          this.selected = e.target.value;
        },
        onRangeInput(e) {
          this.rangeValue = e.target.value;
        },
        onCheckboxChange(e) {
          this.checkboxVal = !this.checkboxVal;
          alert(`Checkbox changed to ${this.checkboxVal}`);
        },
      },
      computed: {},
    }).mount("#app");
  </script>
</html>
