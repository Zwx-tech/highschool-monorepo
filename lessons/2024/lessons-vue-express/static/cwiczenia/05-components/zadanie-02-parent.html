<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
              goldenPrimary: "#F6D108",
              goldenSecondary: "#EDC211",
              goldenDark: "#DAA521",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-goldenDark;
        }
      }

      @layer utilities {
        button {
          @apply py-2 px-5 bg-gradient-to-br from-goldenPrimary to-goldenSecondary saturate-100 hover:saturate-0 rounded-lg tracking-widest text-white transition-all ease-linear duration-200;
        }
        button:disabled {
          @apply bg-none bg-gray-200;
        }
      }
    </style>

    <!-- Move the template to the head -->
    <template id="testComponent">
      <div class="flex flex-col gap-2">
        <h2 class="text-xl">{{title}}</h2>
        <p class="text-lg font-medium text-goldenSecondary">{{ this.value}}</p>
        <button @click="() => parentCallback(this.value)">Update parent</button>
      </div>
    </template>

    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-2 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/golden-vue.svg" alt="V" />
        </a>
        <h1 v-text="title"></h1>
      </div>
      <h2 class="text-3xl mb-4">
        Current parent value <span class="text-goldenPrimary">{{ parentValue }}</span>
      </h2>
      <div class="flex gap-4">
        <component-name v-for="v in items" :value="v" :parent-callback="setParentValue"></component-name>
      </div>
    </div>

    <!-- Vue App Script -->
    <script>
      const ComponentName = {
        template: "#testComponent", // Reference the template by its ID
        props: ["value", "parentCallback"],
        data() {
          return {
            title: "Component",
          };
        },
      };

      // Create and mount the Vue app
      const app = Vue.createApp({
        data() {
          return {
            title: "Parent child communication V2",
            items: [1000, 2000, 3000],
            parentValue: 0,
          };
        },
        methods: {
          setParentValue(value) {
            this.parentValue = value * value;
          },
        },
        computed: {},
        components: {
          "component-name": ComponentName,
        },
      }).mount("#app");
    </script>
  </body>
</html>
