<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
              goldenPrimary: "#F6D108",
              goldenSecondary: "#EDC211",
              goldenDark: "#DAA521",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-goldenDark;
        }
      }

      @layer utilities {
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-4 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/golden-vue.svg" alt="V" />
        </a>
        <h1>{{ title }}</h1>
      </div>
      <div class="flex gap-4">
        <div v-for="car in carData" :class="getCarTileColor(car)" class="flex-1 p-4">
          <p class="mb-2">{{ getCarInfo(car) }}</p>
          <img class="aspect-square object-cover" :src="getCarImg(car)" alt="car" />
        </div>
      </div>
    </div>
  </body>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          title: "Zadanie autka",
          carData: [
            { brand: "Mercedes", model: "Benz", year: 1963 },
            { brand: "Opel", model: "Corsa", year: 1999 },
            { brand: "Audi", model: "A4", year: 2019 },
            { brand: "Mercedes", model: "Benz", year: 2002 },
            { brand: "Opel", model: "Corsa", year: 2010 },
          ],
        };
      },
      methods: {
        getCarInfo(car) {
          return `${car.brand}-${car.model}-${car.year}`;
        },
        getCarImg(car) {
          return `/img/${car.brand}-${car.model}.webp`;
        },
        getCarTileColor(car) {
          return car.year > 2000 ? "bg-green-200" : "bg-red-200";
        },
      },
    }).mount("#app");
  </script>
</html>
