<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#091c14",
              background: "#f5fcf9",
              primary: "#5db692",
              secondary: "#86e3be",
              accent: "#64e1af",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply p-8;
        }
        h1 {
          @apply text-3xl mb-2 text-primary;
        }
      }

      @layer utilities {
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div class="flex items-center gap-4 pb-4">
        <a href="/">
          <img class="aspect-square h-12 pb-1" src="/img/vue.svg" alt="V" />
        </a>
        <h1>{{ title }}</h1>
      </div>
      <h2>samochód: {{ getCar }}</h2>
      <h2>rok produkcji: {{ getYear }}</h2>
      <hr class="my-4" />
      <h2>samochód: {{ getCar }}</h2>
      <h2>rok produkcji: {{ getYear }}</h2>
    </div>
  </body>
  <script>
    Vue.createApp({
      data() {
        return {
          title: "Computed properties",
          type: "Fiat",
          year: 1989,
          model: "Panda",
        };
      },
      computed: {
        getCar() {
          const car = "To jest auto: " + this.type + "" + this.model;
          console.log(car);
        },
        getYear() {
          const year = "To jest rok: " + this.year;
          console.log(year);
          return year;
        },
      },
    }).mount("#app");
  </script>
</html>
